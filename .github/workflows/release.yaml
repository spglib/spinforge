name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
      publish:
        description: Publish the artifacts to PyPI
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tagpr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1.20.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run checks for release pull request
        if: steps.tagpr.outputs.tag == '' && steps.tagpr.outputs.pull_request != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_BRANCH: >-
            ${{ fromJSON(steps.tagpr.outputs.pull_request).head.ref }}
        run: gh workflow run ci.yaml --ref "$RELEASE_PR_BRANCH"

  build:
    needs: tagpr
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.tagpr.outputs.tag != '') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
        needs.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify artifact versions
        run: |
          version="${RELEASE_TAG#v}"
          test -f "dist/spinforge-${version}.tar.gz"
          test -f "dist/spinforge-${version}-py3-none-any.whl"
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [tagpr, build]
    if: >-
      always() && needs.build.result == 'success' &&
      ((github.event_name == 'push' && needs.tagpr.outputs.tag != '') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/spinforge/
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
        needs.tagpr.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          print-hash: true
          verbose: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SpinForge ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*
