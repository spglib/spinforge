name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
      publish:
        description: Publish the artifacts to PyPI
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tagpr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run checks for release pull request
        if: steps.tagpr.outputs.tag == '' && steps.tagpr.outputs.pull_request != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_BRANCH: >-
            ${{ fromJSON(steps.tagpr.outputs.pull_request).head.ref }}
        run: gh workflow run ci.yaml --ref "$RELEASE_PR_BRANCH"

  build:
    needs: tagpr
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.tagpr.outputs.tag != '') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
        needs.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify artifact versions
        run: |
          version="${RELEASE_TAG#v}"
          test -f "dist/spinforge-${version}.tar.gz"
          test -f "dist/spinforge-${version}-py3-none-any.whl"
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [tagpr, build]
    if: >-
      always() && needs.build.result == 'success' &&
      ((github.event_name == 'push' && needs.tagpr.outputs.tag != '') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/spinforge/
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
        needs.tagpr.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          print-hash: true
          verbose: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SpinForge ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*
